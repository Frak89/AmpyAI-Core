name: Frag Orbita APK
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v4
        with: {packages: 'platform-tools'}
      - run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.3.1'}
      - run: gradle :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with: {name: Frag-Orbita-Android17, path: app/build/outputs/apk/debug/*.apk}
