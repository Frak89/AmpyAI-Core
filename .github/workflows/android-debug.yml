name: Android debug APK
on:
  push:
    branches: [main, feature/ampydev-rev1, feature/frag-rev2, feature/frag-rev3, feature/frag-v3-language, feature/frag-v3-associative-code]
  pull_request:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test Fråg neural core and compile APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AmpyAI-Core-Frag-Rev3-Associative-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
