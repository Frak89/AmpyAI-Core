plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ampyai.core'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ampyai.core'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0-rev2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
